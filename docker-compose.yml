services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tore
      POSTGRES_PASSWORD: tore
      POSTGRES_DB: tore_legal_data
    ports:
      - "5433:5432"
    volumes:
      - tore_legal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tore -d tore_legal_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tore
      POSTGRES_PASSWORD: tore
      POSTGRES_DB: tore_legal_data_test
    ports:
      - "5434:5432"
    volumes:
      - tore_legal_pg_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tore -d tore_legal_data_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tore_legal_pg:
  tore_legal_pg_test:
