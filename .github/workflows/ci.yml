name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://tore:tore@localhost:5432/tore_legal_data_test?schema=public
      TEST_DATABASE_URL: postgresql://tore:tore@localhost:5432/tore_legal_data_test?schema=public
      ENGINE_SERVICE_TOKEN: ci-engine-service-token-minimum
      ARCHIVE_ROOT: .data/archive
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tore
          POSTGRES_PASSWORD: tore
          POSTGRES_DB: tore_legal_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tore -d tore_legal_data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply test database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://tore:tore@localhost:5432/tore_legal_data_test?schema=public

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
